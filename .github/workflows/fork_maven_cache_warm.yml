name: Warm fork Maven build cache
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch whose Maven cache key should be warmed
        required: true
        default: feat/iceberg-bloom-filter-writes
        type: string
permissions:
  contents: read
jobs:
  warm:
    if: github.repository == 'NikitaMatskevich/datafusion-comet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Compute Maven cache key
        id: maven-key
        shell: bash
        run: echo "hash=${{ hashFiles('**/pom.xml') }}" >> "$GITHUB_OUTPUT"
      - name: Setup Rust and Java toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: 17
      - name: Restore Maven cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ steps.maven-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-java-maven-
      - name: Warm existing Maven build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Use the Central mirror only while warming; preserve Central's cache identity.
          cat > "$RUNNER_TEMP/maven-warm-settings.xml" <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <mirrors>
              <mirror>
                <id>central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS
          ./mvnw -B -C -s "$RUNNER_TEMP/maven-warm-settings.xml" clean test \
            -Pspark-3.5,scala-2.12,celeborn-reflection-compatibility \
            -Dceleborn.version=0.7.0 -DskipTests
      - name: Save default-branch Maven cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ steps.maven-key.outputs.hash }}-fork-warm-${{ github.run_id }}-${{ github.run_attempt }}
