name: Warm fork Maven parent cache
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch whose Maven cache key should be warmed
        required: true
        default: feat/iceberg-bloom-filter-writes
        type: string
permissions:
  contents: read
jobs:
  warm:
    if: github.repository == 'NikitaMatskevich/datafusion-comet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Restore Maven cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-java-maven-
      - name: Seed existing Apache parent POM
        shell: bash
        run: |
          set -euo pipefail
          artifact=org/apache/apache/23/apache-23.pom
          download="$RUNNER_TEMP/apache-23.pom"
          status=$(curl --location --silent --show-error --max-time 60 \
            --output "$download" --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/$artifact")
          if [ "$status" = 429 ]; then
            curl --fail --location --silent --show-error --max-time 60 \
              --output "$download" \
              "https://maven-central.storage-download.googleapis.com/maven2/$artifact"
          elif [ "$status" != 200 ]; then
            echo "Unexpected Maven Central HTTP status: $status" >&2
            exit 1
          fi
          printf '%s  %s\n' \
            d17d23bcd3d1cd95d15783aaa6f861e3d0bea60f8a1adf6182b298cdf7ad0a1eb74a775b920bfe8324c414747979623a6a4615d18c492dc25d71e48dd6a504b8 \
            "$download" | sha512sum --check
          install -D -m 644 "$download" "/root/.m2/repository/$artifact"
      - name: Save default-branch Maven cache
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            /root/.m2/repository
          key: ${{ runner.os }}-java-maven-${{ hashFiles('**/pom.xml') }}-fork-warm-${{ github.run_id }}
